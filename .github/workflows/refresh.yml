name: Refresh data

# Re-crawls Hacker News and re-enriches from GitHub, then commits
# docs/data/repos.json if anything changed. The HN crawl cache keeps
# old windows, so after the first run only the last week is fetched.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .cache
          key: hn-${{ github.run_id }}
          restore-keys: hn-
      - name: Build the dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data
      - name: Commit if changed
        run: |
          if git diff --quiet docs/data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
